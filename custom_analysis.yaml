# 自定义分析配置（用户可自由增删，无需改代码）
#
# 每个分析项字段：
#   name        分析名称（在命令行 / 网页中引用）
#   unit        结果单位
#   description 一句话说明
#   variables   变量映射：变量名 -> [专业, 指标, 维度(可省略，默认"全区")]
#   expr        表达式，可用变量名及 min/max/abs/round/sum
#   compare     是否计算同比(true/false)
#
# 变量里的「专业/指标/维度」必须与指标宽表中的值对应（见 data/sample_import.csv）。

- name: 工业占GDP比重
  unit: "%"
  description: 规上工业总产值 / 地区生产总值
  variables:
    industry: [工业, 规模以上工业总产值, 全区]
    gdp: [综合, 地区生产总值, 全区]
  expr: "industry / gdp * 100"
  compare: true

- name: 投资效果系数
  unit: ""
  description: 固定资产投资总额 / 地区生产总值
  variables:
    inv: [投资, 固定资产投资总额, 全区]
    gdp: [综合, 地区生产总值, 全区]
  expr: "inv / gdp"
  compare: false
