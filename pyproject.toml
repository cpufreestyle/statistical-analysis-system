[project]
name = "qu-stat-system"
version = "1.5.2"
description = "Asia-Pacific Statistical Analysis System — official public data (World Bank Open Data, China NBS, China Customs) with AI-grounded interpretation"
requires-python = ">=3.9"
# 代码许可为 MIT（见仓库根 LICENSE 文件）；data/ 下的公开数据沿用各数据源自身的许可。
license = {text = "MIT"}
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "flask>=3.0",
    "requests>=2.28",
]

# pandas / openpyxl 仅用于本地 CLI 的 CSV/Excel 文件导入（loader.load_file），
# Vercel Web 运行时不会调用，故作为可选依赖，避免拖慢 Serverless 构建与冷启动。
[project.optional-dependencies]
files = ["pandas>=1.5", "openpyxl>=3.1"]

[project.scripts]
qu-stat = "src.cli:main"

# basedpyright / pyright 配置（必须放在 pyproject.toml 的 [tool.basedpyright] 下；
# report 规则与常规键平铺，不嵌套 [tool.basedpyright.report] 子表）。
[tool.basedpyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "standard"
# 以下多为 SQLAlchemy / pandas / 标准库（argparse、subprocess）类型信息不全导致的
# “教条式”告警，与统计分析系统业务逻辑无关，统一关闭。
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportAny = "none"
reportDeprecated = "none"
reportUnusedImport = "none"

# ---- pytest（质量底线：单元测试 + 路由冒烟）----
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

