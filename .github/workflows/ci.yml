name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Regenerate embedded assets (idempotent, offline)
        # pages.py / seed_data.py 是 scripts/embed_pages.py 生成的，CI 重新生成一次，
        # 保证测试基于最新 public/ 与 data/（开发者若忘跑 embed，CI 也能兜住）。
        run: python scripts/embed_pages.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: i18n smoke (live server, offline-seeded)
        # 起本地服务（自动从 data/*.csv 离线播种），跑 check_i18n.py 探活英文输出无中文泄漏。
        run: |
          python -m src.cli web --host 127.0.0.1 --port 5000 &
          SERVER_PID=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/api/overview >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          python scripts/check_i18n.py
          RC=$?
          kill "$SERVER_PID" || true
          exit $RC

  docs:
    runs-on: ubuntu-latest
    continue-on-error: true   # markdownlint 为可选质量门，不阻塞主流程
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g markdownlint-cli2
      # 忽略项（node_modules / 助手工作目录 / data）统一放在 .markdownlint-cli2.jsonc
      - run: markdownlint-cli2 "**/*.md"
