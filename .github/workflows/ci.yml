name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # 固定镜像标签：ubuntu-latest 将于 2026-10-19 自动切到 Ubuntu 26，
    # 那会让没改代码的提交突然变红。升级镜像时显式改这里。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node 24
        # tests/test_frontend.py 用 node 的 vm 执行 public/*.js 做前端行为检查
        # （零依赖、无 package.json，只要运行时在场即可）。
        # 与本地对齐：开发环境同为 node 24.x。
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Regenerate embedded assets (idempotent, offline)
        # pages.py / seed_data.py 是 scripts/embed_pages.py 生成的，CI 重新生成一次，
        # 保证测试基于最新 public/ 与 data/（开发者若忘跑 embed，CI 也能兜住）。
        run: python scripts/embed_pages.py

      - name: Fail on embedded-asset drift
        # 上一步重生成会让「忘跑 embed」在测试层面看不出问题；这里逐字节比对仓库
        # 已提交的生成物，若有差异说明源码改了但内嵌页没跟着提交——Vercel 无构建
        # 步骤、直接服务仓库里的 src/pages.py，漏提交会直接上线过期前端。
        run: git diff --exit-code -- src/pages.py src/seed_data.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: i18n smoke (live server, offline-seeded)
        # 起本地服务（自动从 data/*.csv 离线播种），跑 check_i18n.py 探活英文输出无中文泄漏。
        run: |
          python -m src.cli web --host 127.0.0.1 --port 5000 &
          SERVER_PID=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/api/overview >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          python scripts/check_i18n.py
          RC=$?
          kill "$SERVER_PID" || true
          exit $RC

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install runtime deps + basedpyright into .venv
        # pyproject 的 [tool.basedpyright] 用 venvPath/venv 指向 .venv，这里同样
        # 建在 .venv，令 CI 与本地解析到同一套 site-packages（缺依赖会退化成一堆
        # 无法判定的 Unknown，门禁就失去意义）。
        # 版本锁死：basedpyright 新版本可能提升规则，把没改代码的提交判红。
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install basedpyright==1.39.9

      - name: Type check src/
        run: .venv/bin/basedpyright

  docs:
    runs-on: ubuntu-24.04
    continue-on-error: true   # markdownlint 为可选质量门，不阻塞主流程
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g markdownlint-cli2
      # 忽略项（node_modules / 助手工作目录 / data）统一放在 .markdownlint-cli2.jsonc
      - run: markdownlint-cli2 "**/*.md"
