# 统计分析系统 配置
region: 亚太
country: EAP          # 世界银行东亚太平洋地区(East Asia & Pacific)地区代码
year: 2024

# 数据源（参考 agent_infini 的 db 管理，这里用本地 SQLite）
database:
  url: "sqlite:///data/qu_stats.db"

# 省级行政区列表（用于分省份口径；全网采集可填充分省数据）
provinces:
  - 北京市
  - 天津市
  - 河北省
  - 山西省
  - 内蒙古自治区
  - 辽宁省
  - 吉林省
  - 黑龙江省
  - 上海市
  - 江苏省
  - 浙江省
  - 安徽省
  - 福建省
  - 江西省
  - 山东省
  - 河南省
  - 湖北省
  - 湖南省
  - 广东省
  - 广西壮族自治区
  - 海南省
  - 重庆市
  - 四川省
  - 贵州省
  - 云南省
  - 西藏自治区
  - 陕西省
  - 甘肃省
  - 青海省
  - 宁夏回族自治区
  - 新疆维吾尔自治区
  - 香港特别行政区
  - 澳门特别行政区
  - 台湾省

# 全网数据采集（公开、无需鉴权的开放数据源；尊重速率限制与 robots）
collection:
  default_source: worldbank
  country: EAP
  year: 2024
  rate_limit_sleep: 0.5          # 每次请求间隔(秒)，避免给数据源压力
  sources:
    worldbank:
      api: "https://api.worldbank.org/v2"
      # 默认抓取的世界银行指标（code -> 中文名）；可用 CLI --indicators 覆盖
      indicators:
        NY.GDP.MKTP.CD: 国内生产总值(GDP)
        NY.GDP.MKTP.KD.ZG: GDP增长率
        NY.GDP.PCAP.CD: 人均GDP
        SP.POP.TOTL: 总人口
        SP.DYN.LE00.IN: 预期寿命
        SL.UEM.TOTL.ZS: 失业率
        FP.CPI.TOTL.ZG: 通货膨胀率(CPI)
        NE.EXP.GNFS.CD: 货物服务出口总额
        NE.IMP.GNFS.CD: 货物服务进口总额
        NV.IND.TOTL.CD: 工业增加值

# 是否接入 InfiniSynapse 云端 AI 分析（需 API Key，默认关闭）
# 启用后，CLI 的 ask --cloud / cloud 与 Web 看板的「AI 云端解读」会直连
# InfiniSynapse Server API（/api/ai/message 发起 newTask + /api/ai/events 收 SSE），
# 不依赖 agent_infini 二进制，调用记录可在服务端审计。
# 注意：外部请求会经系统 HTTP(S)_PROXY（如 127.0.0.1:7897）联网。
#
# API Key 优先级：环境变量 INFINISYNAPSE_API_KEY > 本文件的 api_key。
# 部署到 Vercel / 容器时**请用环境变量**，不要把真实 key 写进被跟踪的 config.yaml。
infinisynapse:
  enabled: true
  server: "https://app.infinisynapse.cn"
  # api_key: "sk-xxx"   # 在 https://app.infinisynapse.cn/ai/apikey 创建后填入
  # 前端会按界面语言传 x-lang（en_US / zh_CN），这里只是兜底默认值
  prefer_language: "zh_CN"

# ── AI provider 选择（可插拔）──────────────────────────────────────
# 用 AI_PROVIDER 环境变量（优先）或本文件的 ai.provider 切换：
#   infinisynapse（默认） —— 国内 InfiniSynapse Server API，调用可审计（比赛要求）。
#   openai_compat         —— 任意 OpenAI 兼容 /chat/completions 端点：
#                            OpenAI / OpenRouter / Groq / DeepSeek / Moonshot /
#                            本地 vLLM · Ollama · LM Studio。
#                            海外用户拿不到 InfiniSynapse key 时也能用「AI 解读」。
#
# 环境变量（优先级高于本文件）：
#   AI_PROVIDER      = infinisynapse | openai_compat
#   OPENAI_API_KEY   = sk-...        （openai_compat 的密钥）
#   OPENAI_BASE_URL  = https://api.openai.com/v1   # 换 OpenRouter/Groq/本地即改这里
#   OPENAI_MODEL     = gpt-4o-mini
#
# 密钥一律走环境变量 —— config.yaml 是被 git 跟踪的，不要把真实 key 写进来。
ai:
  provider: infinisynapse
  openai_compat:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    # api_key 只从环境变量 OPENAI_API_KEY 读取，此处不填
